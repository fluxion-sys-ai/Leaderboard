# ─────────────────────────────────────────────────────────────────────────────
# models.yaml — the edge models under test.
#
# Every model here is run against every benchmark in benchmarks.yaml (full grid).
# The "role" field is descriptive only — a note on why the model is interesting.
# It does NOT restrict which benchmarks the model runs.
#
# All models run through the llama.cpp runner on QUANTIZED GGUF weights, because
# this is an *edge* benchmark: edge devices run GGUF, and the quality hit from
# quantization is part of "how good is this model on edge". The quant level is a
# fixed, reported benchmark parameter (see `defaults.quant`) — same for everyone.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  runner: llamacpp        # maps to src/models/llamacpp_runner.py via the registry
  quant: Q4_K_M           # fixed for all models so scores are comparable
  n_ctx: 20480            # fits BABILong 16k context + gen; safe for 12B on 40GB
  temperature: 0.0        # greedy — deterministic, reproducible scoring
  max_tokens: 1024        # generation cap (overridden per benchmark if needed)

# `gguf` is a HuggingFace repo id + file pattern for the quantized weights.
# We confirm each repo/file actually exists at pull time — never assumed from memory.
models:
  # Local-GGUF example / pipeline smoke model (no download needed).
  # draft_gguf = vocab-compatible small model for the --spec (per-position acceptance) pass.
  - name: llama-3.2-3b
    role: smoke test — local pre-downloaded GGUF
    gguf: { local: /home/ubuntu/models/gguf/Llama-3.2-3B-Instruct-Q4_K_M.gguf }
    draft_gguf: { repo: bartowski/Llama-3.2-1B-Instruct-GGUF, file: "*Q4_K_M.gguf" }

  # ── the locked matrix (all repos resolved from HF API, ungated, Q4_K_M) ──
  - name: qwen2.5-7b-instruct
    role: all-round anchor (local, already Q4_K_M)
    gguf: { local: /home/ubuntu/models/gguf/Qwen2.5-7B-Instruct-Q4_K_M.gguf }
    draft_gguf: { repo: bartowski/Qwen2.5-0.5B-Instruct-GGUF, file: "*Q4_K_M.gguf" }

  - name: llama-3.1-8b-instruct
    role: community baseline
    gguf: { repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF, file: "*Q4_K_M.gguf" }
    draft_gguf: { repo: bartowski/Llama-3.2-1B-Instruct-GGUF, file: "*Q4_K_M.gguf" }

  - name: gemma-2-9b-it
    role: heavyweight (reasoning ceiling, structured output)
    gguf: { repo: bartowski/gemma-2-9b-it-GGUF, file: "*Q4_K_M.gguf" }
    draft_gguf: { repo: bartowski/gemma-2-2b-it-GGUF, file: "*Q4_K_M.gguf" }

  - name: mistral-nemo-12b
    role: long-context specialist (128k)
    gguf: { repo: bartowski/Mistral-Nemo-Instruct-2407-GGUF, file: "*Q4_K_M.gguf" }
    # no spec pass: no small same-tokenizer (Tekken) drafter available

  - name: deepseek-r1-distill-qwen-7b
    role: reasoning / CoT specialist (expect low IFEval — think-stripping needed)
    gguf: { repo: bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF, file: "*Q4_K_M.gguf" }
    draft_gguf: { repo: bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF, file: "*Q4_K_M.gguf" }
    max_tokens_mult: 4        # long CoT — needs 4× the cap or it truncates before answering

  - name: phi-4-mini-instruct        # short alias → used as the results/ folder name
    role: floor / entry (Phi family, edge-realistic ~3.8B)
    gguf: { repo: bartowski/microsoft_Phi-4-mini-instruct-GGUF, file: "*Q4_K_M.gguf" }

  # Qwen3.5-4B un-deferred below (added at proper Q4_K_M via unsloth). Gemma-3-4B
  # still parked: superseded by gemma-4-e4b/gemma-4-12b already in the matrix.

  # More models get added here as we validate each GGUF. Full locked matrix:
  #   qwen3-8b, llama-3.x-8b, gemma-3-12b, mistral-nemo-12b,
  #   deepseek-r1-distill-qwen-7b, gemma-3-4b, phi-4-mini-instruct
  # We start with one model to prove the pipeline, then fan out.

  # ── 2026 additions (added 2026-07-27, run later) ──
  - name: gemma-4-e4b
    role: 2026 flagship edge model (Gemma 4, Apache-2.0)
    gguf: { repo: lmstudio-community/gemma-4-E4B-it-GGUF, file: "*Q4_K_M.gguf" }

  - name: glm-4-9b-0414
    role: new family (THUDM GLM-4, code + function-calling)
    gguf: { repo: bartowski/THUDM_GLM-4-9B-0414-GGUF, file: "*Q4_K_M.gguf" }

  - name: qwen3-8b
    role: Qwen3 dual-mode (thinking) upgrade over Qwen2.5
    gguf: { repo: bartowski/Qwen_Qwen3-8B-GGUF, file: "*Q4_K_M.gguf" }
    max_tokens_mult: 3        # thinking mode -> needs more tokens (like DeepSeek)

  # ── 2026-07-28 additions ──
  - name: llama-xlam-2-8b-fc
    role: agent / function-calling specialist (Salesforce xLAM-2, SOTA-at-8B on BFCL)
    gguf: { repo: Salesforce/Llama-xLAM-2-8b-fc-r-gguf, file: "*Q4_K_M.gguf" }
    draft_gguf: { repo: bartowski/Llama-3.2-1B-Instruct-GGUF, file: "*Q4_K_M.gguf" }

  - name: gemma-4-12b
    role: 2026 flagship Gemma 4 at the 12B tier (completes the Gemma-4 family sweep)
    gguf: { repo: unsloth/gemma-4-12b-it-GGUF, file: "*Q4_K_M.gguf" }
    # multimodal weights, run text-only here; no small same-arch drafter -> no spec pass

  # ── fresh community models scouted 2026-07-28 (recent uploads, verified GGUF) ──
  - name: ornith-1.0-9b
    role: Qwen3.5-9B MoE, RL-trained (deepreinforce-ai) — most-adopted fresh 9B
    gguf: { repo: unsloth/Ornith-1.0-9B-GGUF, file: "*Q4_K_M.gguf" }
    # MoE (qwen3_5_moe): confirm b9892 loads it; runner is resilient if it can't

  - name: tess-4-9b
    role: Qwen3.5-9B reasoning/agentic finetune (migtissera Tess series)
    gguf: { repo: bartowski/migtissera_Tess-4-9B-GGUF, file: "*Q4_K_M.gguf" }

  - name: nanbeige4.2-3b
    role: fresh general EN/ZH 3B (Nanbeige, ~19k dl in first week)
    gguf: { repo: bartowski/Nanbeige_Nanbeige4.2-3B-GGUF, file: "*Q4_K_M.gguf" }

  - name: lfm2.5-8b-a1b
    role: Liquid AI edge MoE — 8.5B total / ~1B active (efficiency-first, 158k dl)
    gguf: { repo: LiquidAI/LFM2.5-8B-A1B-GGUF, file: "*Q4_K_M.gguf" }
    # Lfm2MoeForCausalLM arch: confirm b9892 loads it; runner is resilient if not

  - name: granite-4.1-8b
    role: IBM Granite 4.1 — 8.8B dense, Apache-2.0, huge adoption (3.85M dl); safe arch
    gguf: { repo: ibm-granite/granite-4.1-8b-GGUF, file: "*Q4_K_M.gguf" }

  # Qwen3.5 BASE models (un-defers the floor slot; now available at Q4_K_M).
  # Same Qwen3_5 arch as tess-4-9b/ornith -> base-vs-finetune comparison.
  - name: qwen3.5-9b
    role: Qwen3.5-9B base — anchor for the Ornith/Tess Qwen3.5-9B finetunes
    gguf: { repo: lmstudio-community/Qwen3.5-9B-GGUF, file: "*Q4_K_M.gguf" }

  - name: qwen3.5-4b
    role: Qwen3.5-4B base — floor tier (un-deferred; this GGUF is Q4_K_M, local was Q4_K_S)
    gguf: { repo: unsloth/Qwen3.5-4B-GGUF, file: "*Q4_K_M.gguf" }

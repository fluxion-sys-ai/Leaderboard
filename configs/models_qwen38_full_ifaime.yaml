# Qwen3.8-27B FULL-precision (fp8) IFBench + AIME via OpenRouter (qwen/qwen3.8-27b is now available
# there — no more fragile self-hosted vLLM). fp8-pinned to match the intended precision. Qwen
# thinking-general rec params.
defaults:
  runner: openrouter
  temperature: 1.0
  max_tokens: 1024
  max_tokens_mult: 1     # benchmarks.yaml sets 81920 for ifbench/aime; OpenRouter allows the full budget
models:
  - name: qwen3.8-27b-full
    runner: openrouter
    model_slug: qwen/qwen3.8-27b
    provider: { quantizations: ["fp8"] }   # fp8 ceiling, matching the other Qwen full models
    top_p: 0.95
    top_k: 20
    min_p: 0
    presence_penalty: 0.0
    extra_body: { chat_template_kwargs: { enable_thinking: true } }

    repo: bartowski/Llama-3.2-1B-Instruct-GGUF
    file: '*Q4_K_M.gguf'
- name: qwen2.5-7b-instruct
  role: "all-round anchor. GGUF swapped to the 1M-context build (2026-08-05) \u2014\
    \ base 32K GGUF has NO YaRN baked in so b9892 clamps -c 131072 \u2192 32K; the\
    \ -1M build loads 128K on plain -c."
  gguf:
    repo: bartowski/Qwen2.5-7B-Instruct-1M-GGUF
    file: '*Q4_K_M.gguf'
  draft_gguf:
    repo: bartowski/Qwen2.5-0.5B-Instruct-GGUF

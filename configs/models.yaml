defaults:
  runner: llamacpp
  quant: Q4_K_M
  n_ctx: 20480
  temperature: 0.0
  max_tokens: 1024
models:
- name: llama-3.2-3b
  role: "smoke test \u2014 local pre-downloaded GGUF"

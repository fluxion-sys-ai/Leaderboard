# models_full.yaml — the frontier-30B comparison tab (SEPARATE from the greedy board).
#
# These run over OpenRouter at VENDOR-RECOMMENDED sampling (temp>0), and at FULL
# precision (bf16) WHERE AVAILABLE, to validate against published numbers. This is
# NOT the reproducible greedy leaderboard — keep it on its own tab. Nothing here
# touches the local GPU (runner: openrouter). Needs .openrouter_key to run.
#
# PRECISION IS PER-PROVIDER — every model pins a `provider` block. Verified live
# 2026-08-11 (see MIGRATION.md → "Full-precision runs via OpenRouter"):
#   • Muse Glimmer + Gemma-4-31B  → true bf16 available (pinned below).
#   • BOTH Qwen models            → fp8 ONLY, no bf16. Labelled fp8-ceiling, NOT
#     "full precision" — flag that row on the tab.
#
# Params pulled straight from RECOMMENDED_PARAMS.md (active set: PinchBench / Gaia2 /
# MMMU-Pro / AgentDojo — all agentic/reasoning → each model's thinking/agentic recipe).
# Per-benchmark knobs (e.g. Qwen PinchBench thinking-coding temp 0.6) are noted inline;
# the run driver can override per benchmark.

defaults:
  runner: openrouter
  max_tokens: 1024          # a driver should raise this per-benchmark as needed
  temperature: 1.0

models:
  # ---- Muse Glimmer 30B (Meta) — bf16, FULL precision -------------------------
  # One sampling set; vary reasoning strength. Active set is agentic/reasoning →
  # xhigh (PinchBench/Gaia2), high for MMMU-Pro/AgentDojo. Default xhigh here.
  - name: muse-glimmer-30b-full
    model_slug: meta/muse-glimmer-30b
    precision: bf16                     # true full precision
    precision_label: "bf16 (full precision)"
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    reasoning_strength: xhigh           # injected into the system prompt by the runner
    provider:
      quantizations: ["bf16"]
      order: ["DeepInfra"]              # only bf16 provider for Muse
      allow_fallbacks: false            # fail rather than silently drop to fp8

  # ---- Gemma-4-31B (Google) — bf16, FULL precision ---------------------------
  # All pinned providers serve bf16, so fallback stays full-precision.
  # NEVER DeepInfra/Chutes here — they're fp4 for this model.
  - name: gemma-4-31b-full
    model_slug: google/gemma-4-31b-it
    precision: bf16
    precision_label: "bf16 (full precision)"
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    # Gemma-4 is a reasoning model — thinking is ON by default (the greedy board
    # sets no_think to turn it OFF). The OpenRouter path had NO trigger, so gemma
    # ran non-thinking (mean 253 tok on IFBench) → invalid low scores. chat_template_kwargs
    # is NOT honored by these providers; OpenRouter's unified `reasoning` param IS —
    # verified 2026-08-13: effort=high engaged a 5.3k-char reasoning trace on CoreWeave.
    extra_body:
      reasoning: { effort: high }
    provider:
      quantizations: ["bf16"]
      order: ["OpenInference", "CoreWeave", "Novita"]   # all bf16
      allow_fallbacks: true             # safe — fallbacks are also bf16

  # ---- Qwen3.6-27B — fp8 CEILING (no bf16 on OpenRouter) ----------------------
  # Thinking-general recipe. presence_penalty: the OFFICIAL Qwen3.6-27B card lists
  # thinking-general = 0.0 (verified live 2026-08-11, HF Qwen/Qwen3.6-27B). NOTE the
  # 27B and 35B-A3B cards DIFFER here (35B-A3B = 1.5); they are NOT identical recipes.
  # NEVER greedy in thinking mode. PinchBench-as-coding knob: temp 0.6 if desired.
  - name: qwen3.6-27b-full
    model_slug: qwen/qwen3.6-27b
    precision: fp8                       # NOT full precision — flag on the tab
    precision_label: "fp8 (ceiling — not bf16)"
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0
    presence_penalty: 0.0                # per official 27B card (was 1.5 — corrected)
    provider:
      quantizations: ["fp8"]
      allow_fallbacks: true

  # ---- Qwen3.6-35B-A3B (MoE, ~3B active) — fp8 CEILING ------------------------
  - name: qwen3.6-35b-a3b-full
    model_slug: qwen/qwen3.6-35b-a3b
    precision: fp8
    precision_label: "fp8 (ceiling — not bf16)"
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0
    presence_penalty: 1.5
    provider:
      quantizations: ["fp8"]
      allow_fallbacks: true

  # ---- Qwen3.8-27B (NEW, Aug 2026) — fp8 CEILING -----------------------------
  # thinking-general recipe (presence 0.0, matches the 27B card, NOT 35B's 1.5).
  - name: qwen3.8-27b-full
    model_slug: qwen/qwen3.8-27b
    precision: fp8
    precision_label: "fp8 (ceiling — not bf16)"
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0
    presence_penalty: 0.0
    provider:
      quantizations: ["fp8"]
      allow_fallbacks: true

  # ---- Claude Sonnet 5 (FRONTIER REFERENCE, Sep 2026) — API anchor -----------
  # NOT an edge model: a frontier API baseline so every edge number reads in
  # context ("how close is edge to frontier"). Full-precision only (no Q4 — you
  # can't self-host it), so it renders as a full-precision reference row.
  - name: claude-sonnet-5-ref
    model_slug: anthropic/claude-sonnet-5
    precision: frontier
    precision_label: "frontier reference (Claude Sonnet 5, API)"
    temperature: 1.0
    top_p: 0.95
    provider:
      allow_fallbacks: true
